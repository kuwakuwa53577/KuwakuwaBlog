<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KuwakuwaのBlog</title>
    <meta
      name="description"
      content="kuwakuwa53577が不定期に更新する、便利なことや面白いこと、知ってほしいことなどをまとめたブログです。"
    />
    <meta name="keywords" content="kuwakuwa, Blog, ブログ, 技術, 面白いこと, 便利なこと" />
    <meta name="author" content="kuwakuwa53577" />
    <link rel="icon" href="images (1).png" type="image/x-icon" />
    <link rel="apple-touch-icon" href="images (1).png" />
    <style>
      :root {
        --bg-dark: #1e1e1e;
        --card-bg: #333333;
        --card-hover: #3d3d3d;
        --box-inner-bg: #424242;
        --text-main: #ffffff;
        --text-muted: #aaaaaa;
        --border-color: #333333;
        --accent-blue: #00a3e0;
        --accent-green: #689f78;
        --tag-bg: #444444;
        --tag-hover: #555555;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background-color: var(--bg-dark);
        color: var(--text-main);
        line-height: 1.6;
      }

      .container {
        max-width: 1280px;
        margin: 0 auto;
        padding: 2rem 1.5rem;
      }

      /* レイアウト調整: 3カラム（左240px, 中央1fr, 右280px）を確実に保持 */
      .app-layout {
        display: grid;
        grid-template-columns: 240px 1fr 280px;
        gap: 2rem;
        align-items: start;
        width: 100%;
      }

      /* サイドバー */
      .sidebar {
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
      }

      .site-brand {
        font-size: 1.7rem;
        font-weight: 900;
        color: var(--accent-blue);
        letter-spacing: -1px;
        cursor: pointer;
      }

      .site-title {
        font-size: 1.1rem;
        font-weight: bold;
        margin-top: -0.5rem;
        margin-bottom: 0.5rem;
      }

      .site-description {
        font-size: 0.82rem;
        color: var(--text-muted);
        line-height: 1.5;
      }

      .social-links {
        display: flex;
        gap: 0.8rem;
        margin-top: 0.5rem;
      }

      .social-icon {
        width: 20px;
        height: 20px;
        color: var(--text-muted);
        transition: color 0.2s;
      }

      .social-icon:hover {
        color: var(--text-main);
      }

      .nav-list {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        margin-top: 1rem;
      }

      .nav-btn {
        display: flex;
        align-items: center;
        gap: 1rem;
        background: none;
        border: none;
        color: var(--text-muted);
        font-size: 0.95rem;
        padding: 0.6rem 0;
        cursor: pointer;
        text-align: left;
        transition: color 0.2s;
      }

      .nav-btn:hover, .nav-btn.active {
        color: var(--text-main);
      }

      .nav-btn svg {
        width: 18px;
        height: 18px;
      }

      /* メインコンテンツ */
      .main-content {
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
        min-width: 0; /* 折り返し崩れ防止 */
      }

      .article-card {
        background-color: var(--card-bg);
        border-radius: 12px;
        overflow: hidden;
        cursor: pointer;
        transition: transform 0.2s, background-color 0.2s;
      }

      .article-card:hover {
        background-color: var(--card-hover);
      }

      /* サムネイル画像の表示スタイル */
      .article-card-media {
        width: 100%;
        height: 200px;
        overflow: hidden;
      }

      .article-card-media img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .article-body {
        padding: 1.5rem;
      }

      .article-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin-bottom: 0.8rem;
      }

      .green-tag {
        background-color: var(--accent-green);
        color: white;
        font-size: 0.8rem;
        padding: 0.25rem 0.75rem;
        border-radius: 6px;
        font-weight: bold;
      }

      .article-title {
        font-size: 1.35rem;
        font-weight: bold;
        margin-bottom: 0.5rem;
        line-height: 1.4;
      }

      .article-snippet {
        font-size: 0.9rem;
        color: var(--text-muted);
        margin-bottom: 1rem;
      }

      .article-meta {
        display: flex;
        align-items: center;
        gap: 1.2rem;
        font-size: 0.8rem;
        color: var(--text-muted);
      }

      /* 記事詳細のメディアレンダリング用スタイル */
      .rendered-content {
        line-height: 1.8;
        font-size: 0.95rem;
        border-top: 1px solid var(--border-color);
        padding-top: 1.2rem;
      }

      .rendered-content img {
        max-width: 100%;
        height: auto;
        border-radius: 8px;
        margin: 1rem 0;
        display: block;
      }

      .rendered-content video,
      .rendered-content audio,
      .rendered-content iframe {
        max-width: 100%;
        margin: 1rem 0;
        display: block;
        border-radius: 8px;
      }

      .rendered-content iframe {
        width: 100%;
        aspect-ratio: 16 / 9;
        border: none;
      }

      .rendered-content ul {
        margin: 1rem 0 1rem 1.5rem;
        list-style-type: disc;
      }

      .rendered-content li {
        margin-bottom: 0.3rem;
      }

      /* 新規追加：カスタムマークダウン要素用のスタイル */
      .wiki-btn {
        display: inline-block;
        padding: 0.5rem 1rem;
        background-color: var(--accent-blue);
        color: #ffffff;
        text-decoration: none;
        border-radius: 6px;
        font-weight: bold;
        margin: 0.5rem 0;
        transition: opacity 0.2s;
      }
      .wiki-btn:hover {
        opacity: 0.85;
      }

      details.wiki-details {
        background-color: var(--box-inner-bg);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        padding: 0.8rem 1rem;
        margin: 0.8rem 0;
      }
      details.wiki-details summary {
        cursor: pointer;
        font-weight: bold;
        color: var(--text-main);
      }
      details.wiki-details .wiki-details-body {
        margin-top: 0.5rem;
        padding-top: 0.5rem;
        border-top: 1px solid var(--border-color);
      }

      pre.wiki-code {
        background-color: #121212;
        border: 1px solid var(--border-color);
        padding: 1rem;
        border-radius: 8px;
        overflow-x: auto;
        margin: 0.8rem 0;
      }
      pre.wiki-code code {
        font-family: SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace;
        font-size: 0.9rem;
        color: #e6e6e6;
      }

      /* ページネーションスタイル */
      .pagination {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 1rem;
        margin-top: 1.5rem;
      }

      .pagination button {
        padding: 0.5rem 1rem;
        background-color: var(--card-bg);
        border: 1px solid var(--border-color);
        color: var(--text-main);
        border-radius: 6px;
        cursor: pointer;
        font-size: 0.85rem;
        transition: background-color 0.2s;
      }

      .pagination button:hover:not(:disabled) {
        background-color: var(--card-hover);
      }

      .pagination button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      .pagination .page-info {
        font-size: 0.85rem;
        color: var(--text-muted);
      }

      /* コメント表示 */
      .comments-section {
        margin-top: 2rem;
        border-top: 1px solid var(--box-inner-bg);
        padding-top: 1.5rem;
      }

      .comment-item {
        background-color: var(--box-inner-bg);
        padding: 0.8rem 1rem;
        border-radius: 8px;
        margin-bottom: 0.8rem;
      }

      .comment-header {
        display: flex;
        justify-content: space-between;
        font-size: 0.8rem;
        color: var(--text-muted);
        margin-bottom: 0.3rem;
      }

      .comment-name {
        font-weight: bold;
        color: var(--accent-blue);
      }

      .comment-text {
        font-size: 0.9rem;
        white-space: pre-wrap;
      }

      /* 右カラム */
      .right-widgets {
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
        width: 100%;
      }

      .auth-box {
        background-color: var(--card-bg);
        padding: 1rem;
        border-radius: 8px;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }

      .user-info {
        font-size: 0.85rem;
        color: var(--text-muted);
        word-break: break-all;
      }

      .admin-badge {
        display: inline-block;
        background-color: #d69e2e;
        color: #000;
        font-size: 0.7rem;
        font-weight: bold;
        padding: 0.1rem 0.4rem;
        border-radius: 4px;
        margin-left: 0.4rem;
      }

      .search-widget {
        position: relative;
      }

      .search-widget input {
        width: 100%;
        background-color: var(--card-bg);
        border: 1px solid transparent;
        padding: 0.8rem 2.8rem 0.8rem 1rem;
        border-radius: 8px;
        color: var(--text-main);
        font-size: 0.9rem;
        outline: none;
      }

      .search-widget input:focus {
        border-color: #555555;
      }

      .search-widget svg {
        position: absolute;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        width: 18px;
        height: 18px;
        color: var(--text-muted);
      }

      .widget-header {
        margin-bottom: 0.8rem;
      }

      .widget-title {
        font-size: 0.95rem;
        font-weight: bold;
        color: var(--text-main);
      }

      .archive-box {
        background-color: var(--card-bg);
        border-radius: 8px;
        padding: 0.8rem 1rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 0.9rem;
        font-weight: bold;
        cursor: pointer;
      }

      .archive-count {
        color: var(--text-muted);
        font-size: 0.85rem;
      }

      .category-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
      }

      .category-tag {
        background-color: var(--tag-bg);
        color: var(--text-main);
        font-size: 0.82rem;
        padding: 0.4rem 0.8rem;
        border-radius: 6px;
        cursor: pointer;
        transition: background-color 0.2s;
      }

      .category-tag:hover {
        background-color: var(--tag-hover);
      }

      .btn {
        background-color: var(--accent-blue);
        color: white;
        border: none;
        padding: 0.6rem 1rem;
        border-radius: 6px;
        cursor: pointer;
        font-size: 0.85rem;
        font-weight: bold;
        transition: opacity 0.2s;
      }

      .btn:hover {
        opacity: 0.9;
      }

      .btn-toolbar {
        background-color: var(--tag-bg);
        color: var(--text-main);
        border: none;
        padding: 0.35rem 0.6rem;
        border-radius: 4px;
        font-size: 0.75rem;
        cursor: pointer;
      }

      .btn-toolbar:hover {
        background-color: var(--tag-hover);
      }

      .toolbar-group {
        display: flex;
        gap: 0.4rem;
        margin-bottom: 0.4rem;
        flex-wrap: wrap;
      }

      .form-group {
        margin-bottom: 1.25rem;
      }

      .form-group label {
        display: block;
        margin-bottom: 0.4rem;
        font-size: 0.85rem;
        color: var(--text-muted);
      }

      .form-control {
        width: 100%;
        padding: 0.6rem;
        background-color: var(--box-inner-bg);
        border: 1px solid #555;
        color: var(--text-main);
        border-radius: 6px;
        font-size: 0.95rem;
      }

      textarea.form-control {
        min-height: 180px;
        resize: vertical;
      }

      .view-page {
        display: none;
      }
      .view-page.active {
        display: block;
      }

      .loading-spinner {
        text-align: center;
        padding: 2rem;
        color: var(--text-muted);
      }

      @media (max-width: 960px) {
        .app-layout {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>

                <polyline points="9 22 9 12 15 12 15 22" />

        <main class="main-content">
          <div id="page-home" class="view-page active">
            <h2 style="margin-bottom: 1rem; font-size: 1.2rem;">最新の記事</h2>
            <div id="home-articles-list">
              <div class="loading-spinner">記事を読み込んでいます...</div>
            </div>
            <!-- ホーム画面のページネーション -->
            <div id="home-pagination" class="pagination" style="display: none;">
              <button id="home-prev-btn" onclick="changeHomePage(-1)">前へ</button>
              <span id="home-page-info" class="page-info">1 / 1</span>
              <button id="home-next-btn" onclick="changeHomePage(1)">次へ</button>
            </div>
          </div>
          <div id="page-search" class="view-page">
            <div style="background-color:var(--card-bg); padding:1.5rem; border-radius:12px;">
              <h2 style="margin-bottom: 1rem; font-size: 1.2rem;" id="search-page-title">すべての記事</h2>
              <div id="search-results-list"></div>
              <!-- 検索・一覧画面のページネーション -->
              <div id="search-pagination" class="pagination" style="display: none;">
                <button id="search-prev-btn" onclick="changeSearchPage(-1)">前へ</button>
                <span id="search-page-info" class="page-info">1 / 1</span>
                <button id="search-next-btn" onclick="changeSearchPage(1)">次へ</button>
              </div>
            </div>
          </div>
          <div id="page-detail" class="view-page">
            <div style="background-color:var(--card-bg); padding:1.5rem; border-radius:12px;">
              <h1 id="detail-title" style="font-size: 1.6rem; margin-bottom:0.8rem; line-height:1.3;"></h1>
              <div style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 1rem;" id="detail-meta"></div>
              <div id="detail-tags" class="article-tags" style="margin-bottom: 1.5rem;"></div>
              <div id="detail-content" class="rendered-content"></div>
              <div style="margin-top: 1.5rem;" id="detail-actions">
                <button id="btn-delete" class="btn" style="background-color: #e53e3e; display: none;">
                  この記事を削除 (管理者限定)
                </button>
              </div>
              <div class="comments-section">
                <h3 style="font-size: 1.1rem; margin-bottom: 1rem;">💬 コメント</h3>
                <div id="comments-list" style="margin-bottom: 1.5rem;">
                  <p style="color:var(--text-muted); font-size:0.85rem;">コメントはまだありません。</p>
                </div>
                <form
                  id="comment-form"
                  style="background-color: var(--box-inner-bg); padding: 1rem; border-radius: 8px;"
                >
                  <h4 style="font-size: 0.9rem; margin-bottom: 0.8rem;">コメントを投稿する</h4>
                  <div class="form-group" style="margin-bottom: 0.8rem;">
                    <label>お名前</label>
                    <input
                      type="text"
                      id="comment-name"
                      class="form-control"
                      placeholder="名無しさん"
                      style="background-color: var(--card-bg);"
                    />
                  </div>
                  <div class="form-group" style="margin-bottom: 0.8rem;">
                    <label>コメント内容</label>
                    <textarea
                      id="comment-text"
                      class="form-control"
                      style="min-height: 80px; background-color: var(--card-bg);"
                      required
                    ></textarea>
                  </div>
                  <button type="submit" class="btn" style="background-color: var(--accent-green);">送信</button>
                </form>
              </div>
            </div>
          </div>
          <div id="page-create" class="view-page">
            <div style="background-color:var(--card-bg); padding:1.5rem; border-radius:12px;">
              <h2 style="margin-bottom: 1rem; font-size: 1.2rem;">新規Wikiページの投稿</h2>
              <form id="create-form">
                <div class="form-group">
                  <label>タイトル</label>
                  <input
                    type="text"
                    id="input-title"
                    class="form-control"
                    placeholder="例: おすすめの楽曲・動画まとめ"
                    required
                  />
                </div>
                <div class="form-group">
                  <label>タグ（カンマ区切り）</label>
                  <input type="text" id="input-tags" class="form-control" placeholder="例: 音楽, 動画, リスト" />
                </div>
                <div class="form-group">
                  <label>本文</label>
                  <div class="toolbar-group">
                    <button type="button" class="btn-toolbar" onclick="insertSnippet('image')">🖼 画像を追加</button>
                    <button type="button" class="btn-toolbar" onclick="insertSnippet('video')">🎥 動画URLを追加</button>
                    <button type="button" class="btn-toolbar" onclick="insertSnippet('audio')">🎵 音楽URLを追加</button>
                    <button type="button" class="btn-toolbar" onclick="insertSnippet('list')">
                      📝 リスト項目を追加
                    </button>
                  </div>
                  <textarea
                    id="input-content"
                    class="form-control"
                    placeholder="文章を入力するか、上のボタンからメディアを追加してください..."
                    required
                  ></textarea>
                </div>
                <button type="submit" class="btn">投稿を保存</button>
              </form>
            </div>
          </div>
        </main>
        <aside class="right-widgets">
          <div class="auth-box">
            <div id="user-display" class="user-info">未ログイン (ゲスト)</div>
            <button id="btn-login" class="btn">ログイン (Google)</button>
            <button id="btn-logout" class="btn" style="display:none; background-color:#555;">ログアウト</button>
          </div>
          <div class="search-widget">
            <input type="text" id="search-input" placeholder="ページを検索..." />
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8" />
              <line x1="21" y1="21" x2="16.65" y2="16.65" />
            </svg>
          </div>
          <div>
            <div class="widget-header">
              <div class="widget-title">総記事数</div>
            </div>
            <div class="archive-box" onclick="navigateTo('search')">
              <span>全ページ</span>
              <span class="archive-count" id="archive-count-num">0 件</span>
            </div>
          </div>
          <div>
            <div class="widget-header">
              <div class="widget-title">カテゴリタグ</div>
            </div>
            <div class="category-tags" id="tags-container">
              <span style="color:var(--text-muted); font-size:0.8rem;">タグはありません</span>
            </div>
          </div>
        </aside>
      </div>
    </div>
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
      import { getFirestore, collection, doc, setDoc, addDoc, deleteDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
      import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

      const ADMIN_EMAIL = ["mikancat09@gmail.com", "tannokijiki4@gmail.com", "kuwakuwa.53577.taki@gmail.com", "kuwakuwa53577@gmail.com"];

      const firebaseConfig = {
        apiKey: "AIzaSyAWJ8gxMBqlCH-HGccXb-PpwM7xWVghUNg",
        authDomain: "my-ball-wiki.firebaseapp.com",
        projectId: "my-ball-wiki",
        storageBucket: "my-ball-wiki.firebasestorage.app",
        messagingSenderId: "1004863748430",
        appId: "1:1004863748430:web:584e16403e2eb87c90861f"
      };

      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);
      const auth = getAuth(app);
      const provider = new GoogleAuthProvider();

      let currentUser = null;
      let isAdmin = false;
      let allArticles = [];
      let currentDetailId = null;
      let commentsUnsubscribe = null;

      // ページネーション用状態管理
      const ITEMS_PER_PAGE = 2; // 1ページあたり2つのメッセージ/記事を表示
      let currentHomePage = 1;
      let currentSearchPage = 1;
      let currentSearchFilterTag = null;
      let currentSearchKeyword = '';

      // 画面切り替え
      window.navigateTo = function(pageId, extraData = null) {
        if (pageId === 'create' && !isAdmin) {
          alert('記事投稿権限がありません (管理者専用)');
          return;
        }

        document.querySelectorAll('.view-page').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));

        const target = document.getElementById(`page-${pageId}`);
        if (target) target.classList.add('active');

        const navBtn = document.getElementById(`nav-${pageId}`);
        if (navBtn) navBtn.classList.add('active');

        if (pageId === 'home') {
          currentHomePage = 1;
          renderHomeList();
        } else if (pageId === 'search') {
          currentSearchPage = 1;
          currentSearchFilterTag = extraData ? extraData.filterTag : null;
          currentSearchKeyword = '';
          renderSearchResults();
        }
      };

      document.getElementById('logo-home').addEventListener('click', () => navigateTo('home'));

      // 認証処理
      document.getElementById('btn-login').addEventListener('click', () => {
        signInWithPopup(auth, provider).catch(err => alert("ログインエラー: " + err.message));
      });
      document.getElementById('btn-logout').addEventListener('click', () => signOut(auth));

      onAuthStateChanged(auth, user => {
        currentUser = user;
        isAdmin = user && (ADMIN_EMAIL.includes(user.email));

        const userDisplay = document.getElementById('user-display');
        const navCreate = document.getElementById('nav-create');
        const btnDelete = document.getElementById('btn-delete');

        if (user) {
          userDisplay.innerHTML = `ログイン中: ${user.email} ${isAdmin ? '<span class="admin-badge">管理者</span>' : ''}`;
          document.getElementById('btn-login').style.display = 'none';
          document.getElementById('btn-logout').style.display = 'block';
        } else {
          userDisplay.textContent = '未ログイン (ゲスト)';
          document.getElementById('btn-login').style.display = 'block';
          document.getElementById('btn-logout').style.display = 'none';
        }

        navCreate.style.display = isAdmin ? 'flex' : 'none';
        if (btnDelete) btnDelete.style.display = isAdmin ? 'inline-block' : 'none';

        if (currentUser && currentUser.displayName && document.getElementById('comment-name')) {
          document.getElementById('comment-name').value = currentUser.displayName;
        }
      });

      // ツールバーボタンで定型入力プレースホルダーを差し込む
      window.insertSnippet = function(type) {
        const textarea = document.getElementById('input-content');
        let snippet = "";

        switch(type) {
          case 'image':
            snippet = "\n[img:https://example.com/image.jpg]\n";
            break;
          case 'video':
            snippet = "\nhttps://www.youtube.com/watch?v=XXXXXXX\n";
            break;
          case 'audio':
            snippet = "\nhttps://example.com/music.mp3\n";
            break;
          case 'list':
            snippet = "\n* リスト項目1\n* リスト項目2\n* リスト項目3\n";
            break;
        }

        const start = textarea.selectionStart;
        const end = textarea.selectionEnd;
        textarea.value = textarea.value.substring(0, start) + snippet + textarea.value.substring(end);
        textarea.focus();
      };

      // メディアやリスト・独自マークダウン記法を拡張判定してリッチHTML表示に変換するパーサー関数
      function renderFormattedContent(text) {
        if (!text) return '';

        let processedText = text;

        processedText = processedText.replace(/```([\s\S]*?)```/g, function(match, p1) {
          return `<pre class="wiki-code"><code>${escapeHtml(p1.trim())}</code></pre>`;
        });

        processedText = processedText.replace(/\[title:(.*?)\]([\s\S]*?)\[end\]/g, function(match, title, body) {
          return `<details class="wiki-details"><summary>${escapeHtml(title)}</summary><div class="wiki-details-body">${body}</div></details>`;
        });

        const lines = processedText.split('\n');
        let html = '';
        let inList = false;

        lines.forEach(line => {
          if (line.startsWith('<pre class="wiki-code">') || line.startsWith('<details class="wiki-details">') || line.startsWith('</details>') || line.startsWith('<div class="wiki-details-body">')) {
            if (inList) { html += '</ul>'; inList = false; }
            html += line;
            return;
          }

          const trimmed = line.trim();

          if (trimmed.startsWith('- ') || trimmed.startsWith('* ')) {
            if (!inList) {
              html += '<ul>';
              inList = true;
            }
            const itemText = trimmed.replace(/^[-*]\s+/, '');
            html += `<li>${inlineFormat(itemText)}</li>`;
            return;
          } else if (inList) {
            html += '</ul>';
            inList = false;
          }

          if (trimmed === '') {
            html += '<br>';
            return;
          }

          const ytMatch = trimmed.match(/^(?:https?:\/\/)?(?:www\.)?(?:youtube\.com\/watch\?v=|youtu\.be\/)([\w-]{11})/);
          if (ytMatch) {
            html += `<iframe src="https://www.youtube.com/embed/${ytMatch[1]}" allowfullscreen></iframe>`;
            return;
          }

          if (trimmed.match(/^https?:\/\/.*\.(jpeg|jpg|png|gif|webp|svg)(\?.*)?$/i)) {
            html += `<img src="${escapeHtml(trimmed)}" alt="画像" loading="lazy">`;
            return;
          }

          if (trimmed.match(/^https?:\/\/.*\.(mp4|webm|ogg)(\?.*)?$/i)) {
            html += `<video controls src="${escapeHtml(trimmed)}"></video>`;
            return;
          }

          if (trimmed.match(/^https?:\/\/.*\.(mp3|wav|ogg|m4a)(\?.*)?$/i)) {
            html += `<audio controls src="${escapeHtml(trimmed)}"></audio>`;
            return;
          }

          html += `<p>${inlineFormat(line)}</p>`;
        });

        if (inList) {
          html += '</ul>';
        }

        return html;
      }

      function inlineFormat(str) {
        if (!str) return '';
        let formatted = escapeHtml(str);

        formatted = formatted.replace(/\[open:(.*?)\|(.*?)\]/g, '<a href="$2" target="_blank" rel="noopener" class="wiki-btn">$1</a>');
        formatted = formatted.replace(/\[img:(.*?)\]/g, '<img src="$1" alt="画像" loading="lazy">');
        formatted = formatted.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
        formatted = formatted.replace(/\*(.*?)\*/g, '<em>$1</em>');
        formatted = formatted.replace(/~~(.*?)~~/g, '<del>$1</del>');

        return formatted;
      }

      function getFirstImageUrl(text) {
        if (!text) return null;

        const tagMatch = text.match(/\[img:(.*?)\]/);
        if (tagMatch) return tagMatch[1];

        const lines = text.split('\n');
        for (let line of lines) {
          const trimmed = line.trim();
          if (trimmed.match(/^https?:\/\/.*\.(jpeg|jpg|png|gif|webp|svg)(\?.*)?$/i)) {
            return trimmed;
          }
        }
        return null;
      }

      function escapeHtml(str) {
        return str.replace(/&/g, '&amp;')
                  .replace(/</g, '&lt;')
                  .replace(/>/g, '&gt;')
                  .replace(/"/g, '&quot;')
                  .replace(/'/g, '&#039;');
      }

      // Firestore 記事取得
      const q = query(collection(db, "articles"), orderBy("createdAt", "desc"));
      onSnapshot(q, snapshot => {
        allArticles = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        document.getElementById('archive-count-num').textContent = `${allArticles.length} 件`;
        renderHomeList();
        renderTagsList();
      }, err => {
        console.error("データ取得エラー:", err);
      });

      // ホーム画面のレンダリング (2件ずつ表示)
      function renderHomeList() {
        const container = document.getElementById('home-articles-list');
        const paginationContainer = document.getElementById('home-pagination');

        if (allArticles.length === 0) {
          container.innerHTML = '<p style="color:var(--text-muted)">投稿されたページがまだありません。</p>';
          paginationContainer.style.display = 'none';
          return;
        }

        const totalPages = Math.ceil(allArticles.length / ITEMS_PER_PAGE);
        if (currentHomePage > totalPages) currentHomePage = totalPages;
        if (currentHomePage < 1) currentHomePage = 1;

        const startIndex = (currentHomePage - 1) * ITEMS_PER_PAGE;
        const pageArticles = allArticles.slice(startIndex, startIndex + ITEMS_PER_PAGE);

        container.innerHTML = '';
        pageArticles.forEach(article => {
          container.appendChild(createArticleCard(article));
        });

        // ページネーションUIの更新
        if (allArticles.length > ITEMS_PER_PAGE) {
          paginationContainer.style.display = 'flex';
          document.getElementById('home-page-info').textContent = `${currentHomePage} / ${totalPages}`;
          document.getElementById('home-prev-btn').disabled = currentHomePage === 1;
          document.getElementById('home-next-btn').disabled = currentHomePage === totalPages;
        } else {
          paginationContainer.style.display = 'none';
        }
      }

      window.changeHomePage = function(delta) {
        currentHomePage += delta;
        renderHomeList();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      function renderTagsList() {
        const tagsContainer = document.getElementById('tags-container');
        const tagsSet = new Set();
        allArticles.forEach(a => {
          if (a.tags) a.tags.forEach(t => tagsSet.add(t));
        });

        if (tagsSet.size === 0) {
          tagsContainer.innerHTML = '<span style="color:var(--text-muted); font-size:0.8rem;">タグはありません</span>';
          return;
        }

        tagsContainer.innerHTML = '';
        tagsSet.forEach(tag => {
          const span = document.createElement('span');
          span.className = 'category-tag';
          span.textContent = tag;
          span.onclick = () => navigateTo('search', { filterTag: tag });
          tagsContainer.appendChild(span);
        });
      }

      // 検索・一覧画面のレンダリング (2件ずつ表示)
      function renderSearchResults() {
        const container = document.getElementById('search-results-list');
        const title = document.getElementById('search-page-title');
        const paginationContainer = document.getElementById('search-pagination');
        container.innerHTML = '';

        let results = allArticles;

        if (currentSearchFilterTag) {
          title.textContent = `カテゴリ: ${currentSearchFilterTag} の記事一覧`;
          results = results.filter(a => a.tags && a.tags.includes(currentSearchFilterTag));
        } else if (currentSearchKeyword) {
          title.textContent = `"${currentSearchKeyword}" の検索結果`;
          const kw = currentSearchKeyword.toLowerCase();
          results = results.filter(a =>
            (a.title && a.title.toLowerCase().includes(kw)) ||
            (a.content && a.content.toLowerCase().includes(kw))
          );
        } else {
          title.textContent = 'すべての記事';
        }

        if (results.length === 0) {
          container.innerHTML = '<p style="color:var(--text-muted)">該当するページが見つかりませんでした。</p>';
          paginationContainer.style.display = 'none';
          return;
        }

        const totalPages = Math.ceil(results.length / ITEMS_PER_PAGE);
        if (currentSearchPage > totalPages) currentSearchPage = totalPages;
        if (currentSearchPage < 1) currentSearchPage = 1;

        const startIndex = (currentSearchPage - 1) * ITEMS_PER_PAGE;
        const pageArticles = results.slice(startIndex, startIndex + ITEMS_PER_PAGE);

        pageArticles.forEach(article => {
          container.appendChild(createArticleCard(article));
        });

        // ページネーションUIの更新
        if (results.length > ITEMS_PER_PAGE) {
          paginationContainer.style.display = 'flex';
          document.getElementById('search-page-info').textContent = `${currentSearchPage} / ${totalPages}`;
          document.getElementById('search-prev-btn').disabled = currentSearchPage === 1;
          document.getElementById('search-next-btn').disabled = currentSearchPage === totalPages;
        } else {
          paginationContainer.style.display = 'none';
        }
      }

      window.changeSearchPage = function(delta) {
        currentSearchPage += delta;
        renderSearchResults();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      document.getElementById('search-input').addEventListener('input', (e) => {
        const val = e.target.value.trim();
        currentSearchKeyword = val;
        currentSearchFilterTag = null;
        currentSearchPage = 1;
        navigateTo('search');
      });

      function createArticleCard(article) {
        const div = document.createElement('div');
        div.className = 'article-card';
        div.style.marginBottom = '1.2rem';

        const tagsHtml = (article.tags || []).map(t => `<span class="green-tag">${t}</span>`).join(' ');
        const cleanSnippet = (article.content || '')
          .replace(/\[.*?\]/g, '')
          .replace(/(https?:\/\/[^\s]+)/g, '')
          .substring(0, 100);
        const dateStr = article.createdAt ? new Date(article.createdAt.toDate()).toLocaleDateString('ja-JP') : '日付なし';

        const imageUrl = getFirstImageUrl(article.content);
        const imageHtml = imageUrl ? `
          <div class="article-card-media">
            <img src="${escapeHtml(imageUrl)}" alt="サムネイル" loading="lazy">
          </div>
        ` : '';

        div.innerHTML = `
          ${imageHtml}
          <div class="article-body">
            <div class="article-tags">${tagsHtml}</div>
            <h2 class="article-title">${article.title || '無題'}</h2>
            <p class="article-snippet">${cleanSnippet || 'メディア付き記事'}</p>
            <div class="article-meta">
              <span>📅 ${dateStr}</span>
              <span>👤 ${article.authorName || '管理者'}</span>
            </div>
          </div>
        `;
        div.onclick = () => openDetail(article.id);
        return div;
      }

      function openDetail(id) {
        const article = allArticles.find(a => a.id === id);
        if (!article) return;

        currentDetailId = id;
        document.getElementById('detail-title').textContent = article.title;

        document.getElementById('detail-content').innerHTML = renderFormattedContent(article.content);

        const dateStr = article.createdAt ? new Date(article.createdAt.toDate()).toLocaleString('ja-JP') : '日付不明';
        document.getElementById('detail-meta').textContent = `投稿者: ${article.authorName || '管理者'} | 投稿日: ${dateStr}`;

        const tagsContainer = document.getElementById('detail-tags');
        tagsContainer.innerHTML = (article.tags || []).map(t => `<span class="green-tag">${t}</span>`).join(' ');

        const btnDelete = document.getElementById('btn-delete');
        btnDelete.style.display = isAdmin ? 'inline-block' : 'none';

        listenComments(id);
        navigateTo('detail');
      }

      function listenComments(articleId) {
        if (commentsUnsubscribe) commentsUnsubscribe();

        const qComments = query(collection(db, "articles", articleId, "comments"), orderBy("createdAt", "asc"));
        commentsUnsubscribe = onSnapshot(qComments, snapshot => {
          const commentsList = document.getElementById('comments-list');
          commentsList.innerHTML = '';

          if (snapshot.empty) {
            commentsList.innerHTML = '<p style="color:var(--text-muted); font-size:0.85rem;">コメントはまだありません。</p>';
            return;
          }

          snapshot.forEach(docSnap => {
            const comment = docSnap.data();
            const dateStr = comment.createdAt ? new Date(comment.createdAt.toDate()).toLocaleString('ja-JP') : '投稿中...';
            const div = document.createElement('div');
            div.className = 'comment-item';
            div.innerHTML = `
              <div class="comment-header">
                <span class="comment-name">${escapeHtml(comment.name || '名無しさん')}</span>
                <span>${dateStr}</span>
              </div>
              <div class="comment-text">${escapeHtml(comment.text)}</div>
            `;
            commentsList.appendChild(div);
          });
        });
      }

      document.getElementById('comment-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        if (!currentDetailId) return;

        const nameInput = document.getElementById('comment-name').value.trim();
        const textInput = document.getElementById('comment-text').value.trim();
        if (!textInput) return;

        try {
          await addDoc(collection(db, "articles", currentDetailId, "comments"), {
            name: nameInput || '名無しさん',
            text: textInput,
            createdAt: serverTimestamp()
          });
          document.getElementById('comment-text').value = '';
        } catch (err) {
          console.error(err);
          alert('コメント投稿に失敗しました: ' + err.message);
        }
      });

      document.getElementById('create-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        if (!isAdmin) {
          alert('投稿権限がありません。');
          return;
        }

        const title = document.getElementById('input-title').value.trim();
        const content = document.getElementById('input-content').value.trim();
        const tagsRaw = document.getElementById('input-tags').value;
        const tags = tagsRaw.split(',').map(t => t.trim()).filter(t => t.length > 0);

        try {
          const newRef = doc(collection(db, "articles"));
          await setDoc(newRef, {
            title,
            content,
            tags,
            authorId: currentUser.uid,
            authorName: currentUser.displayName || currentUser.email,
            createdAt: serverTimestamp()
          });

          document.getElementById('create-form').reset();
          openDetail(newRef.id);
        } catch (err) {
          console.error(err);
          alert('保存に失敗しました: ' + err.message);
        }
      });

      document.getElementById('btn-delete').addEventListener('click', async () => {
        if (!isAdmin || !currentDetailId || !confirm('このページを削除してもよろしいですか？')) return;
        try {
          await deleteDoc(doc(db, "articles", currentDetailId));
          navigateTo('home');
        } catch (err) {
          console.error(err);
          alert('削除に失敗しました: ' + err.message);
        }
      });
    </script>
  </body>
</html>
